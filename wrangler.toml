name = "flott-womens-circle-website"
main = "dist/_worker.js/index.js"
compatibility_date = "2025-09-27"
compatibility_flags = ["nodejs_compat"]

[assets]
binding = "ASSETS"
directory = "./dist"

[[d1_databases]]
binding = "GT_DB"
database_name = "grand-table"
database_id = "a8aa4688-3cbd-40a6-9cc5-d335665763d9"

# R2 uploads are OFF until R2 is enabled on the account. To turn on: create the
# bucket, uncomment this block and build with PUBLIC_GT_UPLOADS_ENABLED=true.
# [[r2_buckets]]
# binding = "GT_UPLOADS"
# bucket_name = "grand-table-uploads"

# Astro's Cloudflare adapter auto-enables session storage via KV; the app
# doesn't use Astro.session (auth uses a signed cookie, see src/lib/gt/auth.ts),
# but the binding must exist or the adapter logs an "Invalid binding" warning.
[[kv_namespaces]]
binding = "SESSION"
id = "3e8c3a8171c647ba8af69af4acfab48b"

[vars]
EMAIL_ENABLED = "true"
PAYMENTS_ENABLED = "false"
EMAIL_FROM = "notify@notify.flottwomenscircle.com"
EMAIL_FROM_NAME = "The Grand Table 2026"
ADMIN_NOTIFY_TO = "info@flottwomenscircle.com"
GT_TEST_SUBJECTS = "false"

# Secrets (set with `npx wrangler secret put <NAME>`, never committed):
# ADMIN_PASSWORD
# RESEND_API_KEY
# SESSION_SECRET

# Cloudflare send_email binding: free admin notifications to verified destinations only.
# Requires Email Routing enabled on the notify.flottwomenscircle.com SUBDOMAIN (root MX stays on Zoho)
# and info@flottwomenscircle.com verified as a destination address.
[[send_email]]
name = "SEND_EMAIL"
allowed_destination_addresses = ["info@flottwomenscircle.com"]
