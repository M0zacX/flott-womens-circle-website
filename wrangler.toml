name = "flott-womens-circle-website"
main = "dist/_worker.js/index.js"
compatibility_date = "2025-09-27"
compatibility_flags = ["nodejs_compat"]

[assets]
binding = "ASSETS"
directory = "./dist"

[[d1_databases]]
binding = "GT_DB"
database_name = "grand-table"
database_id = "REPLACE_WITH_D1_ID"

[[r2_buckets]]
binding = "GT_UPLOADS"
bucket_name = "grand-table-uploads"

# Astro's Cloudflare adapter auto-enables session storage via KV; the app
# doesn't use Astro.session (auth uses a signed cookie, see src/lib/gt/auth.ts),
# but the binding must exist or the adapter logs an "Invalid binding" warning.
[[kv_namespaces]]
binding = "SESSION"
id = "REPLACE_WITH_KV_ID"

[vars]
EMAIL_ENABLED = "false"
PAYMENTS_ENABLED = "false"
EMAIL_FROM = ""
ADMIN_NOTIFY_TO = ""

# Secrets (set with `npx wrangler secret put <NAME>`, never committed):
# ADMIN_PASSWORD
# RESEND_API_KEY
# SESSION_SECRET
