# Preview-only config: separate worker so production (flott-womens-circle-website) is never touched.
# No R2 binding yet (R2 not enabled on the account); uploads are disabled via PUBLIC_GT_UPLOADS_ENABLED=false.
name = "fwc-grand-table-preview"
main = "dist/_worker.js/index.js"
compatibility_date = "2025-09-27"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[assets]
binding = "ASSETS"
directory = "./dist"

[[d1_databases]]
binding = "GT_DB"
database_name = "grand-table"
database_id = "a8aa4688-3cbd-40a6-9cc5-d335665763d9"

[[kv_namespaces]]
binding = "SESSION"
id = "3e8c3a8171c647ba8af69af4acfab48b"

[vars]
EMAIL_ENABLED = "false"
PAYMENTS_ENABLED = "false"
EMAIL_FROM = "notify@notify.flottwomenscircle.com"
EMAIL_FROM_NAME = "The Grand Table 2026"
ADMIN_NOTIFY_TO = "info@flottwomenscircle.com"

# Cloudflare send_email binding: free admin notifications to verified destinations only.
# Requires Email Routing enabled on the notify.flottwomenscircle.com SUBDOMAIN (root MX stays on Zoho)
# and info@flottwomenscircle.com verified as a destination address.
[[send_email]]
name = "SEND_EMAIL"
allowed_destination_addresses = ["info@flottwomenscircle.com"]
